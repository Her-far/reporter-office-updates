name: Electimes Office Works tab TEST ONLY
on:
  push:
    branches: [test/electimes-works-tab-20261118]
    paths: ['works-tab-test/**', '.github/workflows/electimes-works-test.yml']
permissions:
  contents: write
concurrency:
  group: electimes-works-test-only
  cancel-in-progress: true
jobs:
  windows-test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated test payload
        working-directory: works-tab-test
        shell: pwsh
        run: |
          node --test policy.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Policy tests failed' }
          npm install --no-save --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          curl.exe --fail --location --retry 3 -o base.exe https://github.com/Her-far/reporter-office-updates/releases/download/electimes-v1.0.12/ElectimesOffice-Setup-1.0.12-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Base download failed' }
          if ((Get-FileHash base.exe -Algorithm SHA256).Hash.ToLower() -ne '8060e3e6e89bf33aed3d3a99fa00d1ea8e85cba22d42c3bc6693b47a38604431') { throw 'Base checksum mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x base.exe -obase-installer -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          node build.cjs base-installer stage
          if ($LASTEXITCODE -ne 0) { throw 'Overlay failed' }
      - name: Test Windows document tabs and Works isolation
        working-directory: works-tab-test
        shell: pwsh
        run: |
          node windows.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows integration failed' }
      - name: Package portable test ZIP
        working-directory: works-tab-test
        shell: pwsh
        run: |
          Move-Item stage ElectimesOffice-Works-Test-1
          & 'C:\Program Files\7-Zip\7z.exe' a -tzip -mx=5 ElectimesOffice-Works-Test-1-Windows-x64.zip ElectimesOffice-Works-Test-1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }
          $hash = (Get-FileHash ElectimesOffice-Works-Test-1-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ElectimesOffice-Works-Test-1-Windows-x64.zip" | Set-Content -Encoding utf8 SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electimes-works-test-1-validation
          path: |
            works-tab-test/works-windows.json
            works-tab-test/*-windows.png
            works-tab-test/stage/BUILD-VERIFICATION.json
            works-tab-test/ElectimesOffice-Works-Test-1/BUILD-VERIFICATION.json
            works-tab-test/ElectimesOffice-Works-Test-1-Windows-x64.zip
            works-tab-test/SHA256SUMS.txt
      - name: Publish explicitly marked prerelease (no production feed changes)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'electimes-works-test-20261118.1';
            const {owner, repo} = context.repo;
            const {data: release} = await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: context.sha, name: '전기신문 Office + Works · 별도 테스트판 1', prerelease: true, make_latest: 'false', body: 'Works를 문서 탭처럼 여는 Windows 테스트판입니다. 정식판 자동 업데이트 대상이 아닙니다. ZIP을 별도 폴더에 모두 압축 해제하고 Electimes Office Works Test.exe를 실행한 뒤, 상단 Works · 테스트를 누르세요. 기존 Works 계정으로 로그인합니다. Works에 저장·수정·삭제하는 내용은 실제 업무자료에 반영됩니다. 자세한 안내는 ZIP 안의 먼저 읽어주세요.txt를 확인하세요.\n\n기반: 정식 Office 1.0.12. 별도 프로필, 자동 업데이트 비활성화. Windows 탭 전환·입력 유지·창 크기·세션 유지·연결 재시도·원격 페이지 권한 격리 검사 통과. 실제 사용자 계정 로그인과 외부 푸시 수신은 자동 검사에 포함하지 않았습니다.'});
            for (const name of ['ElectimesOffice-Works-Test-1-Windows-x64.zip', 'SHA256SUMS.txt', 'works-windows.json']) {
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data: fs.readFileSync('works-tab-test/' + name)});
            }
