name: Publish verified Office AI web prerelease
on:
  push:
    branches: [test/electimes-ai-web-20261118]
    paths: ['.github/workflows/ai-web-test-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested run and publish separate prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Her-far/reporter-office-updates'
          $run=44266276089
          $tested='d129cec2ad7200cdd58850f622e9fb69f5ad82be'
          $result=gh api "repos/$repo/actions/runs/$run"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $result.conclusion -ne 'success' -or $result.head_sha -ne $tested -or $result.head_branch -ne 'test/electimes-ai-web-20261118'){throw 'Exact test build has not passed'}
          $mainBefore=gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha'
          gh run download $run --repo $repo --name electimes-ai-web-test-validation --dir verified-input
          if($LASTEXITCODE -ne 0){throw 'Tested artifact download failed'}
          $root='verified-input/ai-web-test'
          $ui=Get-Content -Raw "$root/ui-windows.json"|ConvertFrom-Json
          $install=Get-Content -Raw "$root/install-windows.json"|ConvertFrom-Json
          $build=Get-Content -Raw "$root/dist/BUILD-VERIFICATION.json"|ConvertFrom-Json
          if(!$ui.pass -or !$install.pass -or $build.productionUpdates -or $build.separateProfile -ne 'ElectimesOffice-AIWeb-Test'){throw 'Test evidence is incomplete'}
          $package=Get-Content -Raw "$root/dist/package-windows.json"|ConvertFrom-Json
          foreach($file in $package.artifacts){
            $path=Join-Path "$root/dist" $file.name
            if((Get-Item $path).Length -ne $file.size -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw 'Installer differs from tested artifact'}
          }
          $assets=@($package.artifacts|ForEach-Object {Join-Path "$root/dist" $_.name})
          $assets+=@("$root/dist/SHA256SUMS.txt","$root/ui-windows.json","$root/install-windows.json")
          gh release create electimes-ai-web-test-v1.0.12.1 @assets --repo $repo --target $tested --title '전기신문 Office AI 웹 채팅 테스트판 1' --notes-file ai-web-test/release-notes.md --prerelease --latest=false
          if($LASTEXITCODE -ne 0){throw 'Prerelease publication failed'}
          $mainAfter=gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha'
          if($mainAfter -ne $mainBefore){throw 'Production branch changed during publication; inspect independently'}
