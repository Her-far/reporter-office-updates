name: Publish verified Office AI web prerelease
on:
  push:
    branches: [test/electimes-ai-web-20261118]
    paths: ['.github/workflows/ai-web-test-publish.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested run and publish separate prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Her-far/reporter-office-updates'
          $run=44275969209
          $tested='75712a37ae857a067999d1a66a5248726ba4fca9'
          $releaseSource='9a5b41404de3d623d12350707ccd401cd1a8a1d2'
          $verification='272550c261c94b729dd3540505b2ad1044eb0a54'
          $result=gh api "repos/$repo/actions/runs/$run"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $result.conclusion -ne 'success' -or $result.head_sha -ne $verification -or $result.head_branch -ne 'test/electimes-ai-web-20261118'){throw 'Exact test build has not passed'}
          $mainBefore=gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha'
          # Publish a content-only source snapshot. GITHUB_TOKEN cannot publish
          # new workflow definitions; this snapshot retains the default workflows.
          # The application subtree must still match the exact tested source.
          $sourceTree=gh api "repos/$repo/git/trees/$releaseSource"|ConvertFrom-Json
          $testedTree=gh api "repos/$repo/git/trees/$tested"|ConvertFrom-Json
          $mainTree=gh api "repos/$repo/git/trees/$mainBefore"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or ($sourceTree.tree|Where-Object path -eq 'ai-web-test').sha -ne ($testedTree.tree|Where-Object path -eq 'ai-web-test').sha -or ($sourceTree.tree|Where-Object path -eq '.github').sha -ne ($mainTree.tree|Where-Object path -eq '.github').sha){throw 'Release source does not match tested application and baseline workflows'}
          gh run download $run --repo $repo --name electimes-ai-web-test-validation --dir verified-input
          if($LASTEXITCODE -ne 0){throw 'Tested artifact download failed'}
          $root='verified-input/ai-web-test'
          $ui=Get-Content -Raw "$root/ui-windows.json"|ConvertFrom-Json
          $install=Get-Content -Raw "$root/install-windows.json"|ConvertFrom-Json
          $build=Get-Content -Raw "$root/dist/BUILD-VERIFICATION.json"|ConvertFrom-Json
          if(!$ui.pass -or !$install.pass -or $install.sourceCommit -ne $tested -or $install.sourceRun -ne 44273901294 -or $build.productionUpdates -or $build.separateProfile -ne 'ElectimesOffice-AIWeb-Test'){throw 'Test evidence is incomplete'}
          $package=Get-Content -Raw "$root/dist/package-windows.json"|ConvertFrom-Json
          foreach($file in $package.artifacts){
            $path=Join-Path "$root/dist" $file.name
            if((Get-Item $path).Length -ne $file.size -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw 'Installer differs from tested artifact'}
          }
          $assets=@($package.artifacts|ForEach-Object {Join-Path "$root/dist" $_.name})
          $assets+=@("$root/dist/SHA256SUMS.txt","$root/ui-windows.json","$root/install-windows.json")
          gh release create electimes-ai-web-test-v1.0.12.2 @assets --repo $repo --target $releaseSource --title '전기신문 Office 구독 대화 테스트판 2' --notes-file ai-web-test/release-notes.md --prerelease --latest=false
          if($LASTEXITCODE -ne 0){throw 'Prerelease publication failed'}
          $mainAfter=gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha'
          if($mainAfter -ne $mainBefore){throw 'Production branch changed during publication; inspect independently'}
