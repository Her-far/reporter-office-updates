name: Publish Electimes Office 1.0.15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/electimes-115.yml', 'electimes-115/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: electimes-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both installers from the published 1.0.14
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Get-Content -Raw electimes-latest.json | ConvertFrom-Json
          if ($old.build -ne 114) { throw 'Unexpected current release' }
          foreach ($entry in @(@('base.exe',$old.fullInstaller),@('previous.exe',$old.installer))) {
            curl.exe -fsSL --retry 3 -o $entry[0] $entry[1].url
            if ($LASTEXITCODE -or (Get-FileHash $entry[0]).Hash.ToLower() -ne $entry[1].sha256) { throw 'Base installer download failed validation' }
          }
          $env:SEVENZIP = 'C:\Program Files\7-Zip\7z.exe'
          $env:MAKENSIS = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $env:MAKENSIS)) { choco install nsis -y --no-progress; if ($LASTEXITCODE) { throw 'NSIS installation failed' } }
          & $env:SEVENZIP x base.exe -obase -y | Out-Null
          if ($LASTEXITCODE) { throw 'Base extraction failed' }
          python electimes-115/stage.py base stage
          if ($LASTEXITCODE) { throw 'Staging failed' }
          python electimes-115/package.py base stage previous.exe dist
          if ($LASTEXITCODE) { throw 'Installer verification failed' }
      - name: Install, compare clean and upgraded files, and start the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Install($file,$dir) {
            $p = Start-Process -FilePath (Resolve-Path $file) -ArgumentList @('/S',"/D=$dir") -Wait -PassThru
            if ($p.ExitCode) { throw "Installer failed with exit code $($p.ExitCode)" }
          }
          $clean = "$env:RUNNER_TEMP\electimes-clean"
          $upgrade = "$env:RUNNER_TEMP\electimes-upgrade"
          Install 'dist/ElectimesOffice-Setup-1.0.15-x64.exe' $clean
          Install 'base.exe' $upgrade
          Install 'dist/ElectimesOffice-Update-1.0.15-x64.exe' $upgrade
          python electimes-115/check-install.py stage $clean $upgrade
          if ($LASTEXITCODE) { throw 'Install parity check failed' }
          foreach ($dir in @($clean,$upgrade)) {
            $profile = "$dir-profile"
            $p = Start-Process -FilePath "$dir\Electimes Office.exe" -ArgumentList "--user-data-dir=$profile" -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(55)
              do { Start-Sleep -Seconds 1; $p.Refresh() } while (!$p.HasExited -and $p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
              if ($p.HasExited -or !$p.MainWindowHandle) { throw 'Office did not open a window' }
            } finally { if (!$p.HasExited) { taskkill /PID $p.Id /T /F | Out-Null } }
          }
      - name: Publish verified binaries, then advance the update feed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'electimes-v1.0.15'
          $feed = Get-Content -Raw dist/electimes-latest.json | ConvertFrom-Json
          git pull --ff-only origin main
          if ($LASTEXITCODE -or (Get-Content -Raw electimes-latest.json | ConvertFrom-Json).build -ne 114) { throw 'Release channel changed' }
          $files = @(Get-ChildItem dist/*.exe,dist/*SHA256SUMS*.txt | ForEach-Object FullName)
          gh release create $tag @files --draft --target $env:GITHUB_SHA --title '전기신문 오피스 1.0.15' --notes ($feed.notes -join "`n`n")
          if ($LASTEXITCODE) { throw 'Draft creation failed' }
          $assets = (gh release view $tag --json assets | ConvertFrom-Json).assets
          foreach ($item in @($feed.installer,$feed.fullInstaller)) {
            $name = ($item.url -split '/')[-1]
            $match = $assets | Where-Object name -eq $name
            if ($match.size -ne $item.size -or $match.digest -ne ('sha256:'+$item.sha256)) { throw "Asset validation failed $name" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
          Copy-Item dist/electimes-latest.json electimes-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add electimes-latest.json
          git commit -m 'Release Electimes Office 1.0.15 through the stable update feed'
          if ($LASTEXITCODE) { throw 'Cannot commit feed' }
          git push origin HEAD:main
          if ($LASTEXITCODE) { throw 'Cannot publish feed' }
