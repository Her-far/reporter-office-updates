name: Pause Electimes Office 1.0.15 publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/electimes-115.yml']
permissions: {}
concurrency:
  group: electimes-production-release
  cancel-in-progress: true
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - run: echo "1.0.15 publication is paused."
