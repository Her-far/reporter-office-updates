name: Recheck exact subscription test installers
on:
  push:
    branches: [test/electimes-ai-web-20261118]
    paths: ['.github/workflows/ai-subscription-install-recheck.yml']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore exact previously built installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Her-far/reporter-office-updates'
          $sourceRun=44273901294
          $sourceSha='75712a37ae857a067999d1a66a5248726ba4fca9'
          $run=gh api "repos/$repo/actions/runs/$sourceRun"|ConvertFrom-Json
          if($run.head_sha -ne $sourceSha){throw 'Wrong source commit'}
          $jobs=gh api "repos/$repo/actions/runs/$sourceRun/jobs"|ConvertFrom-Json
          foreach($step in @('Verify published baseline and build separate test edition','Exercise packaged Windows AI panel','Package compact and complete test installers')){
            if(!($jobs.jobs.steps|Where-Object {$_.name -eq $step -and $_.conclusion -eq 'success'})){throw "Source step did not pass: $step"}
          }
          gh run download $sourceRun --repo $repo --name electimes-ai-web-test-validation --dir verified-input
          if($LASTEXITCODE -ne 0){throw 'Artifact download failed'}
          $root='verified-input/ai-web-test'
          @{sourceRun=$sourceRun;sourceCommit=$sourceSha}|ConvertTo-Json|Set-Content 'verified-input/BUILD-SOURCE.json' -Encoding utf8
          $package=Get-Content -Raw "$root/dist/package-windows.json"|ConvertFrom-Json
          foreach($file in $package.artifacts){
            $path=Join-Path "$root/dist" $file.name
            if((Get-Item $path).Length -ne $file.size -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw 'Tested installer hash mismatch'}
          }
          if(!(Get-Content -Raw "$root/ui-windows.json"|ConvertFrom-Json).pass){throw 'UI verification did not pass'}
          curl.exe --fail --location -o "$root/base.exe" https://github.com/Her-far/reporter-office-updates/releases/download/electimes-v1.0.12/ElectimesOffice-Setup-1.0.12-x64.exe
          if($LASTEXITCODE -ne 0 -or (Get-FileHash "$root/base.exe").Hash.ToLowerInvariant() -ne '8060e3e6e89bf33aed3d3a99fa00d1ea8e85cba22d42c3bc6693b47a38604431'){throw 'Wrong production baseline'}
          & 'C:\Program Files\7-Zip\7z.exe' x "$root/base.exe" "-o$root/base" -y|Out-Null
          if($LASTEXITCODE -ne 0){throw 'Baseline extraction failed'}
          New-Item -ItemType Directory "$root/package" -Force|Out-Null
          $base=@{}
          $baseDir=(Resolve-Path "$root/base").Path
          Get-ChildItem $baseDir -File -Recurse|Where-Object {$_.FullName -notmatch '\$PLUGINSDIR' -and $_.Name -ine 'Uninstall.exe'}|ForEach-Object {$relative=$_.FullName.Substring($baseDir.Length+1).Replace('\','/');$base[$relative]=(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()}
          $base|ConvertTo-Json -Depth 3|Set-Content "$root/package/base-manifest.json" -Encoding utf8
          $script=Get-Content -Raw ai-web-test/install-test.ps1
          $old='if($production.MainWindowHandle -ne 0 -and $test.MainWindowHandle -ne 0){break}'
          $new='if($production.MainWindowHandle -ne 0 -and $test.MainWindowHandle -ne 0 -and $test.MainWindowTitle -match ''AI 웹 테스트''){break}'
          if(!$script.Contains($old)){throw 'Unknown validation script'}
          $script=$script.Replace($old,$new).Replace("throw 'Test edition is not clearly identified'",'throw (''Test edition title did not settle: ''+$test.MainWindowTitle+''; process=''+$test.Id)')
          $script=$script.Replace('$report.sideBySideStartup=$true','$report.sideBySideStartup=$true; $report.testWindowTitle=$test.MainWindowTitle; $report.sourceRun=44273901294; $report.sourceCommit=''75712a37ae857a067999d1a66a5248726ba4fca9''')
          [IO.File]::WriteAllText((Join-Path (Get-Location) "$root/install-test.ps1"),$script)
      - name: Recheck installation and wait for the initialized window title
        shell: pwsh
        run: ./verified-input/ai-web-test/install-test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electimes-ai-web-test-validation
          path: |
            verified-input/BUILD-SOURCE.json
            verified-input/ai-web-test/dist/**
            verified-input/ai-web-test/ui-windows.json
            verified-input/ai-web-test/install-windows.json
            verified-input/ai-web-test/*.png
