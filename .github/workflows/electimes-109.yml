name: Electimes Office 1.0.9 update and panel controls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/electimes-109.yml', 'electimes-109/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: electimes-production-release
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging and test tools
        working-directory: electimes-109
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          npm install --no-save --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Test tools failed' }
          npm ci --ignore-scripts --prefix workpanel
          if ($LASTEXITCODE -ne 0) { throw 'Work panel dependencies failed' }
          node --test workpanel/tests/core.test.cjs workpanel/tests/calendar-connect.test.cjs workpanel/tests/downloads.test.cjs workpanel/tests/mail-reader.test.cjs workpanel/tests/mail-reader-protocol.test.cjs workpanel/tests/linked-attachment.test.cjs workpanel/tests/notes.test.cjs workpanel/tests/migrate.test.cjs workpanel/tests/local-google-client.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Service regression failed' }
      - name: Build public source on production 1.0.6
        id: build
        working-directory: electimes-109
        shell: pwsh
        run: |
          $env:SEVENZIP = 'C:\Program Files\7-Zip\7z.exe'
          curl.exe --fail --location --retry 3 -o base.exe https://github.com/Her-far/reporter-office-updates/releases/download/electimes-v1.0.6/ElectimesOffice-Setup-1.0.6-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Base download failed' }
          python rebuild.py --stage-only
          if ($LASTEXITCODE -ne 0) { throw 'Reconstruction failed' }
          $env:BASE_ASAR = Join-Path $PWD 'base-installer/resources/app.asar'
          node --test workpanel/tests/update-confirm.test.cjs workpanel/tests/update-handoff.test.cjs workpanel/tests/hwp-selection.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Update confirmation regression failed' }
      - name: Verify fresh Google connection and live relay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: electimes-109
        shell: pwsh
        run: |
          node google-connect.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Google connection regression failed' }
      - name: Verify real panel, migration and common width
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: electimes-109
        shell: pwsh
        run: |
          node workpanel-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native work panel regression failed' }
      - name: Verify panel collapse, recovery and left-right movement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: electimes-109
        shell: pwsh
        run: |
          node panel-layout.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Panel layout regression failed' }
      - name: Verify DOC close and reopen through Recent and drop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: electimes-109
        shell: pwsh
        run: |
          node doc-reopen.cjs
          if ($LASTEXITCODE -ne 0) { throw 'DOC reopen regression failed' }
      - name: Verify Find dismissal returns keyboard input to HWP and DOCX
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: electimes-109
        shell: pwsh
        run: |
          node find-focus.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Find keyboard focus regression failed' }
      - name: Reproduce special-character paste and upper-lower blank deletion
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: electimes-109
        run: node line-spacing.cjs
      - name: Verify long HWP selection across pages and tables
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: electimes-109
        run: node hwp-drag.cjs
      - name: Verify clickable mail body attachments and keyboard links
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: electimes-109
        shell: pwsh
        run: |
          node mail-links.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Mail file link regression failed' }
      - name: Verify update download waits for explicit restart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 6
        working-directory: electimes-109
        shell: pwsh
        run: |
          node update-download.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Update download regression failed' }
      - name: Verify legacy and fixed UI install and relaunch
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: electimes-109
        shell: pwsh
        run: |
          node update-install.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Real update install/relaunch failed' }
      - name: Package and inspect installer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: electimes-109
        shell: pwsh
        run: |
          $env:MAKENSIS = 'C:\Program Files (x86)\NSIS\makensis.exe'
          $env:SEVENZIP = 'C:\Program Files\7-Zip\7z.exe'
          python rebuild.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          curl.exe --fail --location --retry 3 -o upgrade-base.exe https://github.com/Her-far/reporter-office-updates/releases/download/electimes-v1.0.8/ElectimesOffice-Setup-1.0.8-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade base download failed' }
          if ((Get-FileHash upgrade-base.exe -Algorithm SHA256).Hash.ToLower() -ne '9609f2d5358965083f2c6c9d0e846bf9e4ccf51bb747144bb6d6d54c9e6ff9bd') { throw 'Upgrade base checksum mismatch' }
          ./smoke.ps1
      - name: Publish verified installer and update channel
        if: ${{ hashFiles('electimes-109/release-hold.txt') == '' }}
        working-directory: electimes-109
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create electimes-v1.0.9 ElectimesOffice-Setup-1.0.9-x64.exe ElectimesOffice-SHA256SUMS-1.0.9.txt windows-smoke.json doc-reopen-windows.json find-focus-windows.json update-download-windows.json update-install-windows.json panel-layout-windows.json workpanel-windows.json google-connect-windows.json --title '전기신문 Office 1.0.9 — 업데이트·패널·찾기 수정' --notes-file release-notes.txt --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          # Update only the company channel; retain concurrent repository work.
          $feed = Get-Content -Raw electimes-latest.json
          Set-Location ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) { throw 'Refresh channel head failed' }
          $current = Get-Content -Raw electimes-latest.json | ConvertFrom-Json
          if ($current.build -ge 109) { throw 'A newer or same release already owns the channel' }
          [IO.File]::WriteAllText((Join-Path $PWD 'electimes-latest.json'), $feed, [Text.UTF8Encoding]::new($false))
          git add electimes-latest.json
          git commit -m 'release: publish Electimes Office 1.0.9 update and panel controls'
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Update feed publication failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electimes-109-validation
          path: |
            electimes-109/*-windows.json
            electimes-109/windows-smoke.json
            electimes-109/startup-*.txt
