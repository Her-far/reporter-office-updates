name: Build isolated Office real-browser test
on:
  push:
    branches: [test/electimes-ai-web-20261118]
    paths: ['.github/workflows/ai-web-test.yml', 'ai-web-test/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-ai-web-test
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ai-web-test
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test and packaging tools
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Test tool installation failed' }
      - name: Verify published baseline and build separate test edition
        run: |
          curl.exe --fail --location --retry 3 -o base.exe https://github.com/Her-far/reporter-office-updates/releases/download/electimes-v1.0.12/ElectimesOffice-Setup-1.0.12-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          if ((Get-FileHash base.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8060e3e6e89bf33aed3d3a99fa00d1ea8e85cba22d42c3bc6693b47a38604431') { throw 'Incorrect baseline' }
          & 'C:\Program Files\7-Zip\7z.exe' x base.exe -obase -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /platform:x64 /reference:System.Web.Extensions.dll /out:browser-companion.exe browser-bridge.cs
          if ($LASTEXITCODE -ne 0) { throw 'Browser helper compilation failed' }
          node --test browser.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Provider boundary tests failed' }
          node build.cjs base stage
          if ($LASTEXITCODE -ne 0) { throw 'Test edition build failed' }
      - name: Exercise packaged Windows AI panel
        timeout-minutes: 16
        run: |
          node browser-ui-test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'AI panel verification failed' }
      - name: Package compact and complete test installers
        run: |
          $env:MAKENSIS='C:\Program Files (x86)\NSIS\makensis.exe'
          python package.py
          if ($LASTEXITCODE -ne 0) { throw 'Test installer packaging failed' }
      - name: Verify independent installation, repeat install and uninstall
        run: ./install-test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electimes-ai-web-test-validation
          path: |
            ai-web-test/dist/**
            ai-web-test/*-windows.json
            ai-web-test/*.png
            ai-web-test/stage/BUILD-VERIFICATION.json
            electimes-110/startup-quit-*.txt
